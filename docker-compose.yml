services:
  notebook:
    build: .
    image: uoc-js
    container_name: uoc-js
    volumes:
      - ./EscolaDeProgramacio:/app/work
    command: sh -c "
      jupyter lab \
        --ip=* \
        --port 8888 \
        --no-browser \
        --allow-root \
        --notebook-dir=/app/work \
        --preferred-dir=/app/work \
        --NotebookApp.token=''"
    ports:
      - 8888:8888
    restart: always